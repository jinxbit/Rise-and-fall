<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS ignores the web manifest for install metadata — these are read instead. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rise & Fall" />
    <title>rise-and-fall</title>
    <script>
      // A deploy removes the previous build's hashed JS/CSS files. A tab that
      // still has an old index.html cached (or was already open) will 404 on
      // those files instead of rendering, so reload once automatically
      // rather than leaving the player stuck on a blank/broken page (issue #247).
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target
          if (!(target instanceof HTMLElement)) return
          if (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') return
          var key = 'rf:reload-on-stale-asset'
          if (sessionStorage.getItem(key)) return
          sessionStorage.setItem(key, '1')
          location.reload()
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
