<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS ignores the web manifest for install metadata — these are read instead. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rise & Fall" />
    <title>rise-and-fall</title>
    <script>
      // A deploy removes the previous build's hashed JS/CSS files. A tab that
      // still has an old index.html cached (or was already open) will 404 on
      // those files instead of rendering, so reload once automatically
      // rather than leaving the player stuck on a blank/broken page (issue #247).
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target
          if (!(target instanceof HTMLElement)) return
          if (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') return
          // The "rfr" URL param is a fallback guard for browsers/privacy modes
          // where sessionStorage throws or doesn't persist across
          // location.reload() — without it, a persistently failing asset
          // retriggers this handler on every load, seen as an infinite
          // refresh loop that only stops when the user hits the browser's
          // Stop button (issue #288).
          if (new URLSearchParams(location.search).has('rfr')) return
          try {
            var key = 'rf:reload-on-stale-asset'
            if (sessionStorage.getItem(key)) return
            sessionStorage.setItem(key, '1')
          } catch {
            // storage access blocked — the URL guard above still applies
          }
          var url = new URL(location.href)
          url.searchParams.set('rfr', '1')
          location.replace(url.toString())
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
