name: Smoke

# Replays real games (src/test/fixtures/productionGames/) against ONE deployed
# Supabase project, through its deployed apply-action/undo-action/redo-action
# Edge Functions, and checks each finishes on the score and winner it finished
# on in production.
#
# This is the half `npm run test` can't cover. CI proves the code is right
# against an in-process stack; this proves a deployment is: migrations
# actually applied, functions actually deployed and booting, RLS actually as
# written, keys still valid.
#
# Which project is decided by environment (DELIVERY_PIPELINE_PLAN.md §4).
# Following a deploy, that is whatever the deploy itself resolved, handed over
# in its `deploy-target` artifact — not re-derived here, because a manual
# deploy's environment input can disagree with its branch and a `workflow_run`
# payload does not carry inputs. Otherwise the branch mapping applies, the
# same one deploy-supabase.yml uses — keep the two in step. `main` deploys and
# smoke-tests Preview; the `production` branch does production.
#
# It writes to a real project, so isolation is the safety story (see
# src/test/productionSmoke/liveProject.ts): throwaway users created and
# deleted per run, a `private` room so it never lists publicly, `play_mode:
# 'live'` so neither notification function can page anyone (both early-return
# unless the game is 'async'), and teardown that deletes the room before the
# users — `games.created_by` and `players.user_id` reference `auth.users` with
# no cascade, so the other order fails and strands the room.
#
# Leftovers, if a run is ever killed hard enough to skip teardown, are one
# `[smoke] …` private room and its throwaway accounts.

on:
  # After a deploy actually lands — the failure this is most likely to catch.
  workflow_run:
    workflows: ['Deploy Supabase']
    types: [completed]
  # And nightly against EVERY environment, for drift no deploy caused: a
  # policy edited in the dashboard, a project setting, an expired key. Running
  # Preview nightly too catches drift there before a promotion runs into it,
  # and keeps a free-tier project from pausing while idle
  # (DELIVERY_PIPELINE_PLAN.md §8).
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to smoke-test'
        type: choice
        # Names must match the GitHub Environments exactly — a name with no
        # environment behind it gets auto-created empty, and an empty
        # environment inherits the repository-level secrets, i.e. production.
        # That is how a run requested for "staging" reached production on
        # 2026-09-09, before the guard below existed.
        options: [Preview, production]
        # Pre-production first, so the riskier target is never the one a
        # mis-click selects.
        default: Preview

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      # Reading the triggering deploy run's artifact, below.
      actions: read
    # A deploy that failed tells us nothing about the deployment we would be
    # testing, so only follow a successful one. Scheduled and manual runs have
    # no workflow_run context and always proceed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      # A JSON array: the nightly run targets every environment at once, while
      # a deploy or a manual run targets exactly one.
      environments: ${{ steps.pick.outputs.environments }}
    steps:
      # What the deploy resolved, straight from the deploy. Allowed to fail:
      # a run of deploy-supabase.yml from before this artifact existed has
      # none, which the step below handles.
      - name: Fetch the deploy's resolved target
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deploy-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: deploy-target

      - name: Resolve the target environments
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.environment }}
          # For a workflow_run the branch that was deployed, not this
          # workflow's own ref — they are the same today but need not be.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          # How the deploy we are following was itself started. A push's
          # branch always agrees with its target; a workflow_dispatch's need
          # not, so that one is never inferred.
          DEPLOY_EVENT: ${{ github.event.workflow_run.event }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            # Every environment, so drift on Preview surfaces on its own
            # schedule rather than when a promotion runs into it.
            resolved='["Preview","production"]'
          elif [ -n "$REQUESTED" ]; then
            resolved="[\"$REQUESTED\"]"
          elif [ -f deploy-target/environment ]; then
            # The deploy's own answer. Still validated against the known names
            # — an artifact is not a place to take a project target on trust,
            # and it is interpolated into JSON below.
            deployed="$(cat deploy-target/environment)"
            case "$deployed" in
              Preview|production) resolved="[\"$deployed\"]" ;;
              *)
                echo "::error::Deploy run $DEPLOY_RUN_ID published an unknown target '$deployed'."
                exit 1
                ;;
            esac
            echo "Following deploy run $DEPLOY_RUN_ID, which targeted '$deployed'."
          elif [ "$EVENT" = "workflow_run" ] && [ "$DEPLOY_EVENT" = "workflow_dispatch" ]; then
            # No artifact and a manually started deploy: its branch says
            # nothing about which project it touched, and smoke-testing the
            # wrong one would report green on a project nobody deployed.
            echo "::error::Deploy run $DEPLOY_RUN_ID was started manually and published no deploy-target artifact, so its target cannot be known. Re-run this workflow with the environment input set."
            exit 1
          else
            # A push, or this workflow started on its own: the branch is the
            # target. Mirrors deploy-supabase.yml's mapping — change both
            # together.
            case "$BRANCH" in
              main) resolved='["Preview"]' ;;
              production) resolved='["production"]' ;;
              *)
                echo "::error::No environment is mapped for branch '$BRANCH'. Add it to the case in .github/workflows/smoke.yml (and deploy-supabase.yml)."
                exit 1
                ;;
            esac
          fi
          echo "environments=$resolved" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing: $resolved"

  smoke:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # One environment failing must not hide the state of the other — a
      # nightly that stopped after Preview would say nothing about production.
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    environment: ${{ matrix.environment }}
    # One job at a time per PROJECT — and the group is shared with
    # deploy-supabase.yml's deploy job, not just with other smoke runs.
    #
    # Two reasons, and the second is why the group is named for the project
    # rather than for this workflow. First, as before: each run creates and
    # deletes real rows, so serializing keeps a failure's leftovers
    # unambiguous. Second, a deploy running *underneath* a smoke run breaks it
    # in a way that looks like a product bug. On 2026-09-13 smoke run #42 sat
    # queued for ~56 minutes waiting for a runner, started at 05:14, and
    # overlapped deploy #61 (05:13:58-05:15:15) against the same Preview
    # project: at 05:14:55 that deploy applied 0031_chat_messages.sql, whose
    # `alter publication supabase_realtime add table` reshapes the very
    # publication the hidden-information check's subscription is listening to,
    # and then redeployed all nine Edge Functions under it. The check failed
    # with "no Realtime payload arrived at all" and was filed against #570 as
    # a product problem. It was not one.
    #
    # Normally smoke follows a deploy (the `workflow_run: completed` trigger
    # above), so they cannot overlap. The gap this closes is a nightly or
    # manual smoke run colliding with a merge-triggered deploy.
    #
    # Different environments stay independent and still run in parallel.
    concurrency:
      group: supabase-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Filing the failure report below.
      issues: write
    env:
      # SMOKE_SUPABASE_URL is optional — it defaults to the project ref the
      # deploy workflow already uses, so a standard environment needs only the
      # two key secrets.
      SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SMOKE_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
      # Used for exactly two things: creating the run's throwaway users and
      # deleting them again. Every game action is submitted as a real signed-in
      # player over the anon key, because submitting as the service role would
      # bypass the authorization this is here to test.
      SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the smoke secrets are configured
        run: |
          missing=()
          [ -n "$SMOKE_SUPABASE_URL" ] || missing+=("SMOKE_SUPABASE_URL or SUPABASE_PROJECT_ID")
          [ -n "$SMOKE_SUPABASE_ANON_KEY" ] || missing+=("SMOKE_SUPABASE_ANON_KEY")
          [ -n "$SMOKE_SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SMOKE_SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets for environment '${{ matrix.environment }}': ${missing[*]}. See this workflow's header."
            exit 1
          fi

      # Same guard, and the same reason, as deploy-supabase.yml's "Refuse to
      # touch the wrong project" — read its comment. It matters at least as
      # much here: a smoke run believing it is on staging while pointed at
      # production would create and delete rooms and accounts in the live
      # database.
      - name: Refuse to smoke-test the wrong project
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$PRODUCTION_PROJECT_ID" ]; then
            echo "::error::Repository variable PRODUCTION_SUPABASE_PROJECT_ID is not set, so the guard that keeps a non-production run away from production cannot work. Set it (Settings -> Secrets and variables -> Actions -> Variables) to the production project ref."
            exit 1
          fi
          production_url="https://${PRODUCTION_PROJECT_ID}.supabase.co"
          if [ "$ENVIRONMENT" = "production" ]; then
            if [ "$SMOKE_SUPABASE_URL" != "$production_url" ]; then
              echo "::error::Environment 'production' resolved to '$SMOKE_SUPABASE_URL', but PRODUCTION_SUPABASE_PROJECT_ID says production is '$production_url'. Refusing to continue."
              exit 1
            fi
          elif [ "$SMOKE_SUPABASE_URL" = "$production_url" ]; then
            echo "::error::Environment '$ENVIRONMENT' resolved to the PRODUCTION project ('$production_url'). That means the '$ENVIRONMENT' GitHub Environment has no SUPABASE_PROJECT_ID (or SMOKE_SUPABASE_URL) of its own and inherited the repository-level one. Add it under Settings -> Environments -> $ENVIRONMENT. Refusing to continue."
            exit 1
          fi
          echo "Environment '$ENVIRONMENT' -> $SMOKE_SUPABASE_URL"

      - name: Replay production games against ${{ matrix.environment }}
        run: |
          set -o pipefail
          npm run test:smoke 2>&1 | tee smoke.log

      # A red smoke run means a deployed backend is wrong, and the person who
      # can fix it should not have to be told by the maintainer first
      # (DELIVERY_PIPELINE_PLAN.md §6 step 2). So the run files its own report,
      # carrying the tail of its output — the failing action and the server's
      # own message — rather than only a link to a log that expires.
      #
      # The repository is public and this text is not scanned for secrets the
      # way Actions logs are, so it is redacted here rather than trusted to be
      # clean: the two key secrets by value, plus anything JWT-shaped, since a
      # JWT is the shape a leak would take.
      #
      # The @claude mention only STARTS anything if the issue is filed by a
      # real token: GitHub deliberately does not trigger workflows from events
      # its own GITHUB_TOKEN caused, so an issue opened with it is filed and
      # then sits there. `AUTOMATION_TOKEN` (a fine-grained PAT with Issues
      # write) is what makes the self-healing half real; without it the report
      # still gets filed, and says so.
      - name: Redact the run log
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          try:
              raw = open('smoke.log', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              raw = '(the run failed before the replay step produced any output)'
          raw = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          for name in ('SMOKE_SUPABASE_ANON_KEY', 'SMOKE_SUPABASE_SERVICE_ROLE_KEY'):
              value = os.environ.get(name) or ''
              if len(value) > 8:
                  raw = raw.replace(value, f'***{name}***')
          raw = re.sub(r'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+', '***redacted-jwt***', raw)
          tail = raw.splitlines()[-120:]
          open('smoke-tail.log', 'w', encoding='utf-8').write('\n'.join(tail))
          PY

      - name: File the failure report
        if: failure()
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          SELF_STARTING: ${{ secrets.AUTOMATION_TOKEN != '' }}
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const environment = process.env.ENVIRONMENT
            const [owner, repo] = [context.repo.owner, context.repo.repo]
            const title = `Smoke failed on ${environment}`
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const tail = fs.readFileSync('smoke-tail.log', 'utf8')

            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            const open = existing.find(i => !i.pull_request && i.title === title)

            // Mentioning @claude starts claude.yml, which is the point on
            // pre-production: the fix begins on its own. Production is left
            // unmentioned on purpose — sending an unattended agent at the live
            // project is the maintainer's call to make, not a side effect of a
            // nightly (§7 keeps production behind an explicit human step).
            // And a mention filed by GITHUB_TOKEN starts nothing at all, so
            // rather than imply otherwise the report says which it is.
            const selfStarting = process.env.SELF_STARTING === 'true'
            const mention = environment === 'production' || !selfStarting ? '' : '@claude '
            const footer = environment === 'production'
              ? 'Filed without an @claude mention: a production failure is the maintainer\'s to direct.'
              : selfStarting
                ? ''
                : 'Filed without an @claude mention because no AUTOMATION_TOKEN is configured — GitHub does not start workflows from events its own GITHUB_TOKEN caused, so the mention would be inert. Comment @claude here to start the fix.'
            const body = [
              `${mention}The smoke test failed against **${environment}**.`,
              '',
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'This replays real recorded games through the deployed Edge Functions, so a failure means the deployed backend disagrees with the engine in this repository, or the deployment itself is broken. Tail of the run:',
              '',
              '````',
              tail,
              '````',
              ...(footer ? ['', footer] : []),
            ].join('\n')

            if (open) {
              // Repeats comment rather than opening another issue, and drop
              // the mention so a nightly that stays red does not start a fresh
              // agent run every night.
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: body.replace('@claude ', '') })
              core.notice(`Commented on existing issue #${open.number}.`)
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body })
              core.notice(`Opened issue #${created.data.number}.`)
            }
