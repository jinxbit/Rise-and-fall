name: Open PR for a Claude branch

# Closes the one gap that stopped the issue -> merge loop from running by
# itself. `claude.yml` answers an @claude mention by pushing a branch and
# posting a "Create PR" link — it does not open the PR. So work that was
# finished, tested and pushed sat unmerged until somebody clicked the link;
# that is exactly what happened to the hidden-information phase 8 branch,
# which was pushed on 2026-09-08 and was still unmerged a day later while
# `main` moved on underneath it.
#
# This opens that PR, and labels it `automerge` so automerge.yml takes it the
# rest of the way on green CI (DELIVERY_PIPELINE_PLAN.md §7). The full loop is
# then: an issue mentioning @claude -> a branch -> a PR -> CI -> `main` ->
# pre-production -> smoke, with no click anywhere in it. Production still
# needs an explicit approval; nothing here can reach it.
#
# Deliberately limited to `claude/issue-**` — the branch shape claude.yml
# creates when answering an issue. An ad-hoc `claude/…` branch (someone
# working interactively) is left alone: that person can open and label their
# own PR, and having every exploratory push become a self-merging PR would be
# a surprise rather than a convenience.
#
# Needs AUTOMATION_TOKEN, for the same reason automerge.yml does: a PR opened
# with GITHUB_TOKEN would not start CI, so automerge.yml would never see a
# green run and the PR would sit exactly as it does today.

on:
  push:
    branches: ['claude/issue-**']

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Open and label the pull request
        uses: actions/github-script@v7
        env:
          HAVE_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
          BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            if (process.env.HAVE_TOKEN !== 'true') {
              core.warning('No AUTOMATION_TOKEN, so a PR opened here would not start CI and could never auto-merge. Not opening one. See this workflow\'s header.')
              return
            }
            const [owner, repo] = [context.repo.owner, context.repo.repo]
            const branch = process.env.BRANCH

            const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' })
            if (existing.data.length > 0) {
              core.info(`PR #${existing.data[0].number} is already open for ${branch}; a push to an open PR needs nothing from here.`)
              return
            }

            // An empty branch, or one already merged, has nothing to propose.
            const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `main...${branch}` })
            if (cmp.data.ahead_by === 0) {
              core.info(`${branch} is not ahead of main; nothing to open a PR for.`)
              return
            }

            // The branch's own commit messages are the description. Whoever
            // wrote them said what they did far better than a template would.
            const commits = cmp.data.commits.map(c => c.commit.message.split('\n')[0])
            const title = commits.length === 1 ? commits[0] : `${commits[commits.length - 1]} (+${commits.length - 1} more)`
            const issue = branch.match(/^claude\/issue-(\d+)-/)?.[1]
            const body = [
              issue ? `Work on #${issue}, pushed by \`claude.yml\`.` : `Pushed by \`claude.yml\`.`,
              '',
              'Commits on this branch:',
              ...commits.map(c => `- ${c}`),
              '',
              'Opened and labelled `automerge` automatically (`claude-branch-pr.yml`), so this merges itself once CI is green. Remove the label to stop that and review it by hand.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            const pr = await github.rest.pulls.create({ owner, repo, head: branch, base: 'main', title, body })
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.data.number, labels: ['automerge'] })
            core.notice(`Opened PR #${pr.data.number} for ${branch} and labelled it automerge.`)
