name: Start the next queued issue

# The last manual step in the loop. Everything after an issue is started
# already runs by itself — claude.yml produces a branch, claude-branch-pr.yml
# opens and labels the PR, automerge.yml merges it on green CI, and `main`
# deploys to pre-production and is smoke-tested there. But *starting* an issue
# still meant a human commenting "@claude". This does that.
#
# The queue is two labels, so it is legible and editable in the GitHub UI
# rather than hidden in a config file:
#
#   queued       ready to be worked. Lowest issue number goes first.
#   priority     jumps ahead of other `queued` issues. Ties break by number.
#   in-progress  started. Removed by the issue closing, or by the stale-start
#                recovery below when a start visibly never happened.
#
# `priority` only reorders what is already queued. It does not start anything
# on its own (an issue still needs `queued`), and it does not interrupt an
# issue already in flight — an urgent bug labelled mid-run goes next, not now.
# Preempting would mean abandoning a half-finished branch, which costs more
# than it saves.
#
# AT MOST ONE ISSUE IS IN FLIGHT. Two agents on two branches touching the same
# files produce conflicting PRs, and untangling those is exactly the human
# intervention this exists to remove. So: if any open issue carries
# `in-progress`, this does nothing. Raise MAX_IN_FLIGHT below if that ever
# feels too slow, but raise it knowing what it buys and costs.
#
# An issue that needs a decision therefore HOLDS the queue, deliberately.
# claude.yml is asked to comment and stop rather than guess when it hits one;
# the issue stays open and `in-progress`, nothing else starts, and the label
# says so at a glance. That is the "unless required" in "without my
# intervention" — the queue waiting for an answer is the system working, not
# failing.
#
# Advancing depends on the issue actually closing, which is why
# claude-branch-pr.yml writes "Closes #N" into the PR body: merging the PR
# closes the issue, closing the issue fires this, this starts the next one.
#
# The schedule is a safety net, not the mechanism. A missed or dropped event
# would otherwise stall the queue silently until somebody noticed, and it is
# what recovers a start that failed (see the staleness check below).

on:
  issues:
    # `labeled` as well as `closed`, because the label IS the interface: an
    # issue marked `queued` while nothing is in flight should start now, not
    # at the next scheduled tick up to an hour later. The job's `if` narrows
    # this to the one label that means anything here — every other label,
    # including the `in-progress` this workflow applies itself, is ignored, so
    # it cannot retrigger itself in a loop.
    types: [closed, labeled]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  # Never two of these deciding what to start at once — both would read "none
  # in flight" and both would start something.
  group: claude-queue
  cancel-in-progress: false

jobs:
  start-next:
    # See the `labeled` note above: only the `queued` label starts anything.
    if: github.event.action != 'labeled' || github.event.label.name == 'queued'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `issues: write`/`pull-requests: write` are for the queue comment and
      # the unstick nudge below, `checks: read` for reading a PR's CI. In
      # practice AUTOMATION_TOKEN does the work and this block only governs
      # the GITHUB_TOKEN fallback, which returns early — but a permissions
      # block that does not describe what the job does is a trap for whoever
      # changes the token next.
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Start the next queued issue
        uses: actions/github-script@v7
        env:
          HAVE_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const MAX_IN_FLIGHT = 1
            const QUEUED = 'queued'
            const PRIORITY = 'priority'
            const IN_PROGRESS = 'in-progress'

            if (process.env.HAVE_TOKEN !== 'true') {
              core.warning('No AUTOMATION_TOKEN. A comment posted with GITHUB_TOKEN does not start claude.yml, so this would mark an issue in-progress and then leave it sitting. Doing nothing. See this workflow\'s header.')
              return
            }
            const [owner, repo] = [context.repo.owner, context.repo.repo]

            // Both labels, created on demand — a label that does not exist
            // cannot be applied, and a queue nobody can label is not a queue.
            for (const [name, color, description] of [
              [QUEUED, '0e8a16', 'Ready for Claude to pick up, lowest number first (claude-queue.yml)'],
              [PRIORITY, 'b60205', 'Goes ahead of other queued issues; does not interrupt one already in flight'],
              [IN_PROGRESS, 'fbca04', 'Started by claude-queue.yml; holds the queue until it closes'],
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description })
                core.info(`Created the ${name} label.`)
              } catch (e) {
                if (e.status !== 422) throw e
              }
            }

            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            const issues = open.filter(i => !i.pull_request)
            const labelled = (issue, name) => issue.labels.some(l => (l.name ?? l) === name)

            // An issue is only really in flight if the run it started
            // produced something. claude.yml can die before Claude begins —
            // on 2026-09-09 an unauthenticated Supabase-CLI version lookup hit
            // the API rate limit and killed a run eight seconds in — and an
            // issue left `in-progress` by a start that never happened holds
            // the queue forever, silently. So a started issue with no branch,
            // no open PR and no activity for STALE_AFTER_MINUTES is treated as
            // never started and gets restarted on the next tick. The window is
            // generous because a real run is slow (the longest so far was 44
            // minutes) and restarting a live one would produce exactly the
            // duplicate branches MAX_IN_FLIGHT exists to prevent.
            const STALE_AFTER_MINUTES = 90
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 })
            const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            const startedWork = (number) => (
              branches.some(b => b.name.startsWith(`claude/issue-${number}-`)) ||
              openPrs.some(pr => pr.head.ref.startsWith(`claude/issue-${number}-`))
            )
            const staleSince = Date.now() - STALE_AFTER_MINUTES * 60_000

            const inFlight = []
            for (const issue of issues.filter(i => labelled(i, IN_PROGRESS))) {
              if (startedWork(issue.number)) { inFlight.push(issue); continue }
              if (new Date(issue.updated_at).getTime() > staleSince) { inFlight.push(issue); continue }
              core.warning(`#${issue.number} has been in progress since ${issue.updated_at} with no branch and no open PR — treating its start as failed and restarting it.`)
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: IN_PROGRESS }).catch(() => {})
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [QUEUED] })
              issue.labels = [{ name: QUEUED }, ...issue.labels.filter(l => (l.name ?? l) !== IN_PROGRESS)]
            }
            // `in-progress` with an open PR is not the same as work that is
            // moving. When that PR's CI is red, or its head conflicts with
            // main, nobody is coming back for it: the claude.yml run that
            // pushed the branch ended at the push, automerge.yml only ever
            // acts on a *successful* CI run, and the stale-start recovery
            // above excludes anything with an open PR by design. So the queue
            // held behind it indefinitely, with nothing scheduled to notice —
            // which is how a flaky chat test (todo.md #109) came to block an
            // unrelated issue for a day.
            //
            // The fix is a comment, because a comment is what starts
            // claude.yml. It is bounded twice: once per head commit, so a fix
            // that lands and fails again gets a fresh look while a stuck
            // commit is not re-poked every hour, and MAX_NUDGES in total,
            // after which this stands down and says so on the PR rather than
            // spending runs on something that needs a person.
            const NUDGE_IDLE_MINUTES = 20
            const MAX_NUDGES = 3
            const NUDGE = '<!-- claude-queue:unstick -->'
            const STOOD_DOWN = '<!-- claude-queue:stood-down -->'

            async function unstick(issue) {
              const summary = openPrs.find(p => p.head.ref.startsWith(`claude/issue-${issue.number}-`))
              if (!summary) return
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: summary.number })
              if (pr.state !== 'open' || pr.draft) return

              // A PR touched in the last few minutes is being worked on right
              // now, and its CI may still be running. Let it be.
              if (Date.now() - new Date(pr.updated_at).getTime() < NUDGE_IDLE_MINUTES * 60_000) return

              const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 100 })
              const failing = checks.check_runs
                .filter(c => ['failure', 'timed_out', 'action_required'].includes(c.conclusion))
                .map(c => c.name)
              // `mergeable` is null while GitHub computes it — unknown is not
              // a conflict, and the next tick will know.
              const conflicted = pr.mergeable === false
              if (failing.length === 0 && !conflicted) return

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })
              const nudges = comments.filter(c => c.body.includes(NUDGE))
              if (nudges.some(c => c.body.includes(pr.head.sha))) {
                core.info(`PR #${pr.number}: already nudged for ${pr.head.sha.slice(0, 7)}; waiting.`)
                return
              }
              if (nudges.length >= MAX_NUDGES) {
                core.warning(`PR #${pr.number} (issue #${issue.number}) is still stuck after ${nudges.length} nudges and is holding the queue. A human needs to look at it.`)
                if (!comments.some(c => c.body.includes(STOOD_DOWN))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: [
                    `This PR has been nudged ${nudges.length} times and is still not green, so the queue has stopped trying.`,
                    '',
                    `It is holding issue #${issue.number}, and therefore everything queued behind it, until someone looks. Fix it, close it, or drop the \`in-progress\` label from #${issue.number} to let the queue move on without it.`,
                    '',
                    STOOD_DOWN,
                    '',
                    '---',
                    '_Generated by [Claude Code](https://claude.ai/code)_',
                  ].join('\n') })
                }
                return
              }

              const why = conflicted && failing.length > 0
                ? `its head conflicts with \`main\` and CI is red (${failing.map(n => `\`${n}\``).join(', ')})`
                : conflicted
                  ? 'its head conflicts with `main`'
                  : `CI is red (${failing.map(n => `\`${n}\``).join(', ')})`

              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: [
                `@claude this PR is stuck — ${why} — and nothing is coming back for it on its own.`,
                '',
                `It closes #${issue.number}, which holds the queue while it stays open, so everything queued behind it is waiting on this.`,
                '',
                '- **Fix it on this branch and push.** The PR merges itself once CI is green; do not open a new one.',
                '- **A conflict is resolved by merging `main` in**, not by rebasing or force-pushing this branch.',
                '- **If the failure is not this PR\'s** — red on `main` too, or in code this diff does not touch — say so here and fix it where it belongs rather than widening this PR.',
                '- **Never skip, disable or quarantine a test to get green**, and never push an empty commit to re-run CI.',
                '- **Run `npm run lint`, `npm run test` and `npm run build` before pushing.**',
                '',
                `${NUDGE}${pr.head.sha}`,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n') })
              core.notice(`Nudged PR #${pr.number} (issue #${issue.number}): ${why}.`)
            }

            if (inFlight.length >= MAX_IN_FLIGHT) {
              for (const issue of inFlight) await unstick(issue)
              core.info(`Holding: ${inFlight.map(i => `#${i.number}`).join(', ')} still in progress.`)
              return
            }

            // Priority first, then oldest — issue numbers are monotonic, so
            // the number is the filing order and the tiebreak is FIFO within
            // each band. Two bands is deliberately all there is: a scale of
            // five turns every triage into a comparison, and this queue is
            // one issue deep at a time anyway.
            const band = (issue) => (labelled(issue, PRIORITY) ? 0 : 1)
            const queued = issues
              .filter(i => labelled(i, QUEUED))
              .sort((a, b) => band(a) - band(b) || a.number - b.number)
            if (queued.length === 0) {
              core.info('Nothing queued.')
              return
            }

            for (const issue of queued.slice(0, MAX_IN_FLIGHT - inFlight.length)) {
              // A branch already open against this issue means it was started
              // by hand; adopt that rather than starting a second agent on it.
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 })
              const existing = prs.data.find(pr => pr.head.ref.startsWith(`claude/issue-${issue.number}-`))
              if (existing) {
                core.info(`#${issue.number} already has PR #${existing.number} open; marking it in progress rather than starting it again.`)
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [IN_PROGRESS] })
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: QUEUED }).catch(() => {})
                return
              }

              const body = [
                '@claude please pick this up.',
                '',
                'Started automatically from the queue (`claude-queue.yml`), so nobody is watching this land — which changes what "done" means here:',
                '',
                '- **Push your branch and stop.** The PR is opened, labelled and merged for you; do not post a "Create PR" link.',
                '- **`main` is pre-production, not production.** Merging deploys to the Preview Supabase project and runs the smoke test there. Reaching real players needs a separate human approval, so a mistake here is recoverable — but it is still a deploy.',
                '- **Read `CLAUDE.md` first**, and the plan document the issue names. This repository keeps its design record in doc comments and plan files; update them in the same commit when you change what they describe.',
                '- **Run `npm run lint`, `npm run test` and `npm run build` before pushing.** Nobody will catch it for you if you do not.',
                '- **If this needs a decision rather than an implementation, say so here and stop.** Do not guess. The queue holds while this issue is open, which is the intended way to ask for an answer — an unanswered question costs a pause, a wrong guess costs a deploy.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n')

              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [IN_PROGRESS] })
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: QUEUED }).catch(() => {})
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body })
              core.notice(`Started #${issue.number}: ${issue.title}`)
            }
